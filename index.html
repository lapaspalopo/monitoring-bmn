<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring BMN</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='15' y='25' width='70' height='50' fill='%234A90E2' stroke='%232C5AA0' stroke-width='2' rx='3'/><path d='M15 25 L50 45 L85 25' fill='none' stroke='%232C5AA0' stroke-width='2'/></svg>" type="image/svg+xml">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
    }
    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loader-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: 10;
      transition: opacity 0.5s ease-out;
    }
    .loader-wrapper.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-content {
      text-align: center;
    }
    .spinner {
      width: 60px;
      height: 60px;
      margin: 0 auto 24px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loader-text {
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .dots {
      display: inline-block;
      width: 20px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ffffff;
      margin: 0 3px;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .dot:nth-child(1) {
      animation-delay: -0.32s;
    }
    .dot:nth-child(2) {
      animation-delay: -0.16s;
    }
    .dot:nth-child(3) {
      animation-delay: 0s;
    }
    @keyframes bounce {
      0%, 80%, 100% {
        opacity: 0.3;
        transform: scale(0.8);
      }
      40% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <div class="loader-wrapper" id="loader">
      <div class="loader-content">
        <div class="spinner"></div>
        <div class="loader-text">
          Konfigurasi, Harap Menunggu
             </div>
      </div>
    </div>
    <iframe 
      src="https://script.google.com/macros/s/AKfycby3FsHafFz5W3tp4N762cSlSSVYUyj7ZrwisXEpaYPHVvMs1ZiHxiKB2nYK8lx3f5g6/exec" 
      title="Hasdan Web App"
      onload="document.getElementById('loader').classList.add('hidden');"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
